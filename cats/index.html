<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>캠퍼스 고양이 (시안)</title>
<!-- 시안: 서버 없이 움직인다. 고양이 위치와 이름은 예시이고, 모은 기록은 저장되지 않는다. -->
<style>
:root{--g:#244f3d;--o:#e8552e;--ink:#26392f;--mute:#6b7a70;--line:#dfe7e0;--bg:#f7faf7;--y:#f2c230}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:#fff;display:grid;grid-template-columns:360px 1fr;height:100vh;overflow:hidden}
aside{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
#mapwrap{position:relative;min-height:300px}#map{position:absolute;inset:0}
header{padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:19px;margin:0}
.draft{font-size:11px;color:#9b3a16;background:#fff1ea;border-radius:6px;padding:2px 7px}
#prog{margin-top:8px;font-size:13px;color:var(--mute)}#prog b{color:var(--ink)}
.bar{height:7px;border-radius:4px;background:#e4ebe6;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--y)}
.pane{flex:1;overflow:auto;padding:12px 14px 14px;min-height:0}
.book{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{border:1px solid var(--line);border-radius:12px;padding:10px 6px 8px;text-align:center;background:#fff;cursor:pointer;font:inherit}
.cat .f{font-size:30px;line-height:1.1;filter:grayscale(1) brightness(.35);opacity:.6}.cat.got .f{filter:none;opacity:1}
.cat b{display:block;font-size:13px;margin-top:4px}.cat small{display:block;font-size:11px;color:var(--mute)}
.cat.on{outline:3px solid var(--g);outline-offset:1px}.cat.legend{grid-column:span 3;background:#fffbea;border-color:#f0dc9a}
#card{display:none;border-top:1px solid var(--line);padding:14px 16px 16px;background:var(--bg)}#card.show{display:block}
#card .top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute)}#card .x{margin-left:auto;border:0;background:none;font-size:18px;color:var(--mute);cursor:pointer}
#card h2{font-size:17px;margin:4px 0 6px}#card p{font-size:13.5px;line-height:1.55;margin:0 0 8px}
.hint{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.55;margin-bottom:8px}
.hint.hot{border-color:#e8a33a;background:#fff8e8}
.btns{display:flex;gap:6px}.btns button{flex:1;font:inherit;font-size:13px;padding:9px;border:1px solid #cfdcd3;border-radius:9px;background:#fff;cursor:pointer;color:var(--g)}
.stars{font-size:16px;letter-spacing:2px;color:#e0a100}
#vbar{position:absolute;left:12px;bottom:12px;z-index:5;display:flex;background:#fff;border:1px solid var(--line);border-radius:11px;padding:3px;box-shadow:0 4px 14px #0001}#vbar button{font:inherit;font-size:13px;padding:7px 12px;border:0;border-radius:8px;background:none;cursor:pointer}#vbar button.on{background:var(--g);color:#fff;font-weight:800}
#hintbar{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:5;background:#1d3a2ce8;color:#fff;font-size:12.5px;padding:8px 13px;border-radius:10px;max-width:90%;text-align:center}
#start{position:fixed;inset:0;z-index:50;background:#1c2b2266;display:flex;align-items:center;justify-content:center;padding:16px}
#start .box{width:min(440px,100%);background:#fff;border-radius:16px;padding:22px;box-shadow:0 18px 50px #0003}
#start h2{margin:0 0 6px;font-size:21px}#start p{margin:0 0 12px;color:#4d6355;font-size:14px;line-height:1.6}
#start ul{margin:0 0 6px;padding-left:18px;font-size:13px;color:#4d6355;line-height:1.7}
.go{width:100%;font:inherit;font-size:14px;font-weight:800;padding:11px;border:0;border-radius:10px;background:var(--o);color:#fff;cursor:pointer;margin-top:14px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d3a2c;color:#fff;font-size:13px;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}#toast.on{opacity:1}
@media(max-width:760px){body{grid-template-columns:1fr;grid-template-rows:52vh 1fr}#mapwrap{order:-1}aside{border-right:0;border-top:1px solid var(--line)}body.carding .pane{display:none}}
</style>
</head>
<body>
<aside>
  <header>
    <div class="brand"><h1>캠퍼스 고양이</h1><span class="draft">시안 · 예시 고양이</span></div>
    <div id="prog"></div>
  </header>
  <div class="pane" id="pane"></div>
  <div id="card"></div>
</aside>
<div id="mapwrap"><div id="map"></div><div id="hintbar">도감에서 고양이를 고르고, 지도에서 그 고양이가 있을 곳을 눌러 보세요</div><div id="vbar"><button data-v="3d" class="on">입체</button><button data-v="2d">평면</button></div></div>

<div id="start"><div class="box">
  <h2>캠퍼스 고양이 도감</h2>
  <p>성심교정 골목 곳곳에 사는 고양이를 찾아 도감을 채워요.</p>
  <ul>
    <li>고양이마다 <b>사는 곳 힌트</b>가 있어요. "낭만계단 중간쯤 볕 드는 곳"처럼요.</li>
    <li>지도에서 그곳을 눌러요. 틀리면 <b>어느 쪽으로 얼마나</b> 가야 하는지 알려 줘요.</li>
    <li>적게 틀릴수록 별이 많아요. 모두 모으면 전설의 고양이가 나타나요.</li>
  </ul>
  <button class="go" id="startGo">찾으러 가기</button>
</div></div>
<div id="toast"></div>

<script src="https://cukmap.com/kit/v1/cukmap.js"></script>
<script>
(async () => {
const $ = id => document.getElementById(id);
const toast = t => { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2800); };
// 예시 고양이: 위치는 학생들이 이름으로 부르는 장소(cukmap 지도의 장소 기록)에 두었다
const CATS = [
  { id: 'cheese', name: '치즈', face: '🐈', at: [106, 140], spot: '고양이길(메이플로드)', hint: '이름부터 고양이 길. 니콜스관 동쪽 아래, 가을이면 단풍이 빨갛게 덮이는 길이에요.' },
  { id: 'black', name: '까망이', face: '🐈‍⬛', at: [97, -17], spot: '낭만계단', hint: '스머프동산 동쪽 비탈을 오르는 계단 중간쯤, 볕 드는 곳에서 자요.' },
  { id: 'calico', name: '삼색이', face: '🐱', at: [37, 10], spot: '스머프동산(하늘동산)', hint: '학생미래인재관 앞, 동그랗게 솟은 잔디 언덕 꼭대기를 좋아해요.' },
  { id: 'mackerel', name: '고등어', face: '😺', at: [-2, 90], spot: '통곡의 언덕', hint: '다솔관 북쪽 옆 가파른 오르막. 지각하는 학생들을 구경해요.' },
  { id: 'tuxedo', name: '턱시도', face: '😸', at: [-72, 0], spot: '도서관 앞 삼거리', hint: '중앙도서관 앞, 미카엘관 쪽으로 길이 갈라지는 곳에서 사람들을 기다려요.' },
  { id: 'yellow', name: '노랑이', face: '😻', at: [-261, -110], spot: '성심관 벚꽃길', hint: '봄이면 벚꽃이 터널처럼 덮이는 성심관 쪽 길. 학교 서쪽 끝이에요.' },
  { id: 'grey', name: '회색이', face: '😼', at: [278, 85], spot: '정문 오르막', hint: '정문으로 들어와 김수환관 쪽으로 오르는 비탈. 학교에 오는 사람을 제일 먼저 봐요.' },
  { id: 'spot', name: '점박이', face: '🙀', at: [24, 123], spot: '다솜길', hint: '다솔관과 밤비노관 사이 좁은 길. 이름도 비슷해서 헷갈려요.' },
];
const LEGEND = { id: 'chisam', name: '치삼이', face: '🌟', at: [133, 166], spot: '예수성심광장', hint: '모든 고양이를 모은 사람에게만 나타나요. 학교 한가운데 성당 앞 광장에서 기다린대요.' };
const josa = (w, a, b) => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return w + (c >= 0 && c <= 11171 && c % 28 ? a : b); };
const NEAR = 18; // 이 거리(m) 안이면 찾음
const st = {}; for (const c of [...CATS, LEGEND]) st[c.id] = { tries: 0, got: false };
let cur = null;

const map = await CUKmap.create('#map', { view: '3d', focus: '니콜스관', select: false });
const allGot = () => CATS.every(c => st[c.id].got);
const dir = (dx, dz) => { const a = Math.atan2(dx, -dz) * 180 / Math.PI, n = ['북', '북동', '동', '남동', '남', '남서', '서', '북서']; return n[((Math.round(a / 45) % 8) + 8) % 8]; };
const stars = n => n <= 1 ? '★★★' : n <= 3 ? '★★☆' : '★☆☆';

function drawProg() { const n = CATS.filter(c => st[c.id].got).length; $('prog').innerHTML = `도감 <b>${n} / ${CATS.length}</b>${st.chisam.got ? ' · 전설 ✓' : ''}<div class="bar"><i style="width:${n / CATS.length * 100}%"></i></div>`; }
function drawBook() {
  const list = [...CATS, ...(allGot() ? [LEGEND] : [])];
  $('pane').innerHTML = `<div class="book">${list.map(c => { const s = st[c.id]; return `<button class="cat${s.got ? ' got' : ''}${cur === c ? ' on' : ''}${c === LEGEND ? ' legend' : ''}" data-id="${c.id}"><span class="f">${c.face}</span><b>${s.got ? c.name : '???'}</b><small>${s.got ? c.spot + ' · ' + stars(s.tries) : c === LEGEND ? '전설의 고양이' : '찾는 중'}</small></button>`; }).join('')}</div>
    ${allGot() ? '' : `<p style="font-size:12px;color:#6b7a70;margin-top:12px">모두 모으면 전설의 고양이가 나타나요. 고양이 이름·위치는 시안용 예시예요.</p>`}`;
  $('pane').querySelectorAll('.cat').forEach(b => b.onclick = () => openCat([...CATS, LEGEND].find(c => c.id === b.dataset.id)));
}
function openCat(c) {
  cur = c; drawBook(); const s = st[c.id], card = $('card'); card.classList.add('show'); document.body.classList.add('carding');
  if (s.got) {
    card.innerHTML = `<div class="top"><span>${c.spot}</span><button class="x">×</button></div><h2>${c.face} ${c.name}</h2>
      <p class="stars">${stars(s.tries)}</p><p>${c.hint}</p>
      <div class="btns"><button id="seeGround">지상 시점으로 그 자리 보기</button><button id="seeMap">지도로 보기</button></div>
      <p style="font-size:12px;color:#6b7a70;margin-top:8px">실제로 그 자리에 가서 고양이 사진을 찍으면 "직접 만남" 표시가 붙는 기능을 넣을 수 있어요(현장 인증).</p>`;
    card.querySelector('#seeGround').onclick = async () => { try { await map.walkAt({ x: c.at[0], z: c.at[1] + 6, look: { x: c.at[0], z: c.at[1] } }); } catch (e) { toast('지상 시점을 열지 못했어요: ' + e.message); } };
    card.querySelector('#seeMap').onclick = async () => { await map.setView('3d'); setV('3d'); await map.focus({ x: c.at[0], z: c.at[1], zoom: 80 }); };
  } else {
    card.innerHTML = `<div class="top"><span>찾는 중 · 틀린 횟수 ${s.tries}</span><button class="x">×</button></div><h2>${c === LEGEND ? '🌟 전설의 고양이' : '❓ 이 고양이는 어디에?'}</h2>
      <div class="hint">${c.hint}</div><div class="hint hot" id="hot" style="display:none"></div>
      <p style="font-size:12.5px;color:#6b7a70">지도에서 그곳을 눌러 보세요. (${NEAR}m 안이면 찾아요)</p>`;
    $('hintbar').textContent = '지도에서 고양이가 있을 곳을 눌러 보세요';
  }
  card.querySelector('.x').onclick = () => { card.classList.remove('show'); document.body.classList.remove('carding'); cur = null; drawBook(); };
}
map.on('click', async e => {
  if (!cur || st[cur.id].got) { toast('먼저 도감에서 찾을 고양이를 골라 주세요.'); return; }
  const c = cur, s = st[c.id], dx = c.at[0] - e.x, dz = c.at[1] - e.z, d = Math.hypot(dx, dz);
  if (d <= NEAR) {
    s.got = true; await map.addPin({ id: c.id, x: c.at[0], z: c.at[1], label: c.face + ' ' + c.name, color: '#e0a100' });
    toast(`${josa(c.name, '을', '를')} 찾았어요! ${stars(s.tries)}`); drawProg(); openCat(c);
    if (c !== LEGEND && allGot()) setTimeout(() => toast('모든 고양이를 모았어요… 어디선가 전설의 고양이 소리가 들려요!'), 2900);
  } else {
    s.tries++; const h = $('hot'); h.style.display = 'block';
    h.textContent = d > 150 ? `한참 멀어요. ${dir(dx, dz)}쪽으로 ${Math.round(d / 10) * 10}m쯤 가야 해요.` : d > 60 ? `가까워지고 있어요. ${dir(dx, dz)}쪽으로 ${Math.round(d / 5) * 5}m쯤.` : `아주 가까워요! ${dir(dx, dz)}쪽으로 조금만 더 (${Math.round(d)}m).`;
    card_tries(s.tries);
  }
});
const setV = v => document.querySelectorAll('#vbar button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
document.querySelectorAll('#vbar button').forEach(b => b.onclick = async () => { await map.setView(b.dataset.v); setV(b.dataset.v); });
const card_tries = n => { const t = $('card').querySelector('.top span'); if (t) t.textContent = '찾는 중 · 틀린 횟수 ' + n; };
$('startGo').onclick = () => { $('start').remove(); drawProg(); drawBook(); openCat(CATS[0]); };
drawProg(); drawBook();
})().catch(e => { console.error(e); document.getElementById('pane').textContent = '불러오지 못했어요: ' + e.message; });
</script>
</body>
</html>
