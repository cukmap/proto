<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>캣츠 · 성심교정 고양이 찾기</title>
<!-- 시안: cukmap 3D 지도의 지상 시점으로 학교를 걸어 다니며, 학교 곳곳(별명 붙은 길·계단·언덕)에 숨은 고양이를 찾는다.
     힌트가 실제 장소라서, 힌트를 따라가다 보면 학교 지리를 알게 된다. 조작은 마인크래프트처럼(날기 없음). -->
<style>
:root{--g:#244f3d;--o:#e8552e;--ink:#26392f;--mute:#6b7a70;--line:#dfe7e0;--bg:#f7faf7}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:#0f1a14;overflow:hidden}
#map{position:fixed;inset:0}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);display:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1px #0006}#cross:before{left:8px;top:0;width:2px;height:18px}#cross:after{top:8px;left:0;height:2px;width:18px}
body.locked #cross{display:block}
#quest{position:absolute;left:14px;top:14px;width:min(340px,calc(100% - 28px));background:#0f1a14d9;color:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 6px 20px #0005}
#quest .t{font-size:12px;color:#b9d3c4;font-weight:700;letter-spacing:.5px}
#quest .n{font-size:17px;font-weight:800;margin:3px 0}
#quest .h{font-size:13.5px;line-height:1.55;color:#e8f1ec}
#warm{margin-top:8px;font-size:14px;font-weight:800}
#count{position:absolute;right:14px;top:14px;background:#0f1a14d9;color:#fff;border-radius:12px;padding:9px 13px;font-size:14px;font-weight:800}
#clickhint{position:absolute;left:50%;top:58%;transform:translateX(-50%);background:#000a;color:#fff;padding:10px 18px;border-radius:10px;font-size:15px;display:none}
body.ready:not(.locked):not(.menu) #clickhint{display:block}
.modal{position:fixed;inset:0;z-index:30;background:#0c1510a6;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.box{width:min(560px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:16px;padding:20px 22px;box-shadow:0 18px 50px #0005}
.box h2{margin:0 0 6px;font-size:21px}.box .sub{margin:0 0 14px;color:var(--mute);font-size:14px;line-height:1.6}
.big{width:100%;font:inherit;font-size:15px;font-weight:800;padding:12px;border:0;border-radius:10px;background:var(--o);color:#fff;cursor:pointer}
.keys{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;color:#33463b;margin-top:14px;background:var(--bg);border-radius:10px;padding:10px 12px}
.keys b{font-family:ui-monospace,monospace;font-size:12px;background:#fff;border:1px solid #d7e2db;border-radius:5px;padding:1px 6px;justify-self:start}
.sec{font-size:14px;font-weight:800;margin:16px 2px 6px;color:var(--g)}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;background:#fff;cursor:pointer;font:inherit}
.cat .f{font-size:30px}.cat b{display:block;font-size:13.5px;margin-top:2px}.cat small{display:block;font-size:11.5px;color:var(--mute);margin-top:2px;line-height:1.4}
.cat.lock{background:#f1f3f1;color:#9aa39d}.cat.on{outline:3px solid var(--o)}
.cat.lock .f{filter:grayscale(1) brightness(.4)}
#found .f{font-size:64px;text-align:center}#found h2{text-align:center}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d3a2c;color:#fff;font-size:13.5px;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}#toast.on{opacity:1}
#start input{width:100%}
</style>
</head>
<body>
<div id="map"></div>
<div id="hud"><div id="cross"></div>
  <div id="quest"><div class="t">찾는 중</div><div class="n" id="qn"></div><div class="h" id="qh"></div><div id="warm"></div></div>
  <div id="count"></div>
  <div id="clickhint">화면을 누르면 걸을 수 있어요</div>
</div>

<div class="modal on" id="start"><div class="box">
  <h2>🐈 성심교정 고양이를 찾아라</h2>
  <p class="sub">학교 곳곳, 별명이 붙은 길과 계단과 언덕에 고양이들이 숨어 있어요. 힌트를 읽고 <b>직접 걸어서</b> 찾아가 보세요. 가까이 가면 고양이를 만날 수 있어요.</p>
  <div class="keys"><b>W A S D</b><span>걷기</span><b>마우스</b><span>둘러보기</span><b>스페이스</b><span>점프</span><b>Ctrl</b><span>달리기</span><b>Esc</b><span>메뉴·도감</span></div>
  <button class="big" id="go" style="margin-top:16px">들어가기</button>
</div></div>

<div class="modal" id="menu"><div class="box">
  <h2>도감</h2><p class="sub" id="dexsub"></p>
  <button class="big" id="resume">▶ 계속 찾기</button>
  <div class="sec">어떤 고양이를 찾을까요? (누르면 그 고양이 힌트로 바뀌어요)</div>
  <div class="dex" id="dex"></div>
  <div class="keys"><b>W A S D</b><span>걷기</span><b>마우스</b><span>둘러보기</span><b>스페이스</b><span>점프</span><b>Ctrl</b><span>달리기</span><b>Esc</b><span>이 메뉴</span></div>
  <button id="reset" style="margin-top:12px;font:inherit;font-size:12.5px;border:0;background:none;color:var(--mute);cursor:pointer;text-decoration:underline">처음부터 다시 하기</button>
</div></div>

<div class="modal" id="found"><div class="box">
  <div class="f" id="ff"></div><h2 id="fn"></h2><p class="sub" id="fs"></p>
  <button class="big" id="fnext">다음 고양이 찾기</button>
</div></div>
<div id="toast"></div>

<script src="https://cukmap.com/kit/v1/cukmap.js"></script>
<script>
(async () => {
const $ = id => document.getElementById(id);
const toast = (t, ms = 2800) => { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), ms); };
const josa = (w, a, b) => { const c = w.charCodeAt(w.length - 1) - 0xAC00; return w + (c >= 0 && c <= 11171 && c % 28 ? a : b); };

// 고양이와 숨은 곳. 장소는 학생들이 부르는 별명이 있는 곳 위주(실제 지도 좌표)
const CATS = [
  { id: 'cheese', name: '치즈', face: '🐈', at: [106, 140], spot: '고양이길(메이플로드)', hint: '이름부터 고양이 길. 니콜스관 동쪽 아래, 가을이면 단풍이 빨갛게 덮이는 길이에요.', look: { base: '#e8a04a', b: '#fff4e0', pat: 'stripe', p: '#c9772a' } },
  { id: 'black', name: '까망이', face: '🐈‍⬛', at: [97, -17], spot: '낭만계단', hint: '스머프동산 동쪽 비탈을 오르는 계단 중간쯤, 볕 드는 곳에서 자요.', look: { base: '#26292b', b: '#26292b' } },
  { id: 'calico', name: '삼색이', face: '🐱', at: [37, 10], spot: '스머프동산(하늘동산)', hint: '학생미래인재관 앞, 동그랗게 솟은 잔디 언덕 꼭대기를 좋아해요.', look: { base: '#f4f1ea', b: '#f4f1ea', pat: 'patch', p: '#e8a04a', p2: '#2b2b2b' } },
  { id: 'mackerel', name: '고등어', face: '😺', at: [-2, 90], spot: '통곡의 언덕', hint: '다솔관 북쪽 옆 가파른 오르막. 지각하는 학생들을 구경해요.', look: { base: '#8d9296', b: '#e9ecee', pat: 'stripe', p: '#4b5056' } },
  { id: 'tuxedo', name: '턱시도', face: '😸', at: [-72, 0], spot: '도서관 앞 삼거리', hint: '중앙도서관 앞, 미카엘관 쪽으로 길이 갈라지는 곳에서 사람들을 기다려요.', look: { base: '#222426', b: '#f4f4f2' } },
  { id: 'yellow', name: '노랑이', face: '😻', at: [-261, -110], spot: '성심관 벚꽃길', hint: '봄이면 벚꽃이 터널처럼 덮이는 성심관 쪽 길. 학교 서쪽 끝이에요.', look: { base: '#f2c46a', b: '#f2c46a' } },
  { id: 'grey', name: '회색이', face: '😼', at: [278, 85], spot: '정문 오르막', hint: '정문으로 들어와 김수환관 쪽으로 오르는 비탈. 학교에 오는 사람을 제일 먼저 봐요.', look: { base: '#9aa1a6', b: '#9aa1a6' } },
  { id: 'spot', name: '점박이', face: '🙀', at: [24, 123], spot: '다솜길', hint: '다솔관과 밤비노관 사이 좁은 길. 이름도 비슷해서 헷갈려요.', look: { base: '#f4f4f2', b: '#f4f4f2', pat: 'patch', p: '#2b2b2b' } },
];
const LEGEND = { id: 'chisam', name: '치삼이', face: '🌟', at: [133, 166], spot: '예수성심광장', hint: '모든 고양이를 모은 사람에게만 나타나요. 학교 한가운데 성당 앞 광장에서 기다린대요.', look: { base: '#ffd76a', b: '#fff6d6', pat: 'stripe', p: '#e8a04a' } };
const ALL = [...CATS, LEGEND];
const NEAR = 3.2; // 이만큼(m) 가까이 가면 만남

// 블록 고양이(한 칸 25cm): 몸 3칸 길이, 머리, 귀, 꼬리. 앞쪽이 -z
function catCells(L) {
  const o = [], h = (x, y, z) => Math.abs(Math.sin(x * 12.9 + y * 78.2 + z * 37.7) * 43758) % 1;
  const col = (x, y, z, part) => { if (part === 'belly') return L.b; if (L.pat === 'stripe' && (z % 2 === 0)) return L.p; if (L.pat === 'patch') { const r = h(x, y, z); if (r < .25) return L.p; if (L.p2 && r < .4) return L.p2; } return L.base; };
  for (let x = 0; x < 2; x++) for (let z = 0; z < 3; z++) o.push([x, 1, z, col(x, 1, z)], [x, 0, z, col(x, 0, z, 'belly')]); // 몸
  for (const [x, z] of [[0, 0], [1, 0], [0, 2], [1, 2]]) o.push([x, -1, z, L.b]); // 다리
  for (let x = 0; x < 2; x++) for (let y = 1; y < 3; y++) o.push([x, y, -1, col(x, y, -1)]); // 머리
  o.push([0, 3, -1, L.base], [1, 3, -1, L.base]); // 귀
  o.push([0, 2, -2, '#1d2a22'], [1, 2, -2, '#1d2a22'], [0, 1, -2, '#ff9ec7']); // 눈·코(앞면)
  o.push([0, 1, 3, L.base], [0, 2, 3, L.base], [0, 3, 3, L.base]); // 꼬리
  return o.map(q => [q[0], q[1] + 1, q[2], q[3]]);
}

// 기록(이 브라우저에만)
let got = new Set(); try { got = new Set(JSON.parse(localStorage.getItem('cukcats.got') || '[]')); } catch (_) {}
const save = () => { try { localStorage.setItem('cukcats.got', JSON.stringify([...got])); } catch (_) {} };
const pool = () => CATS.every(c => got.has(c.id)) ? ALL : CATS;
let target = null;
const pickNext = () => pool().find(c => !got.has(c.id)) || null;

const map = await CUKmap.create('#map', { view: '3d', focus: '니콜스관', select: false });
let started = false, pos = null;

function drawQuest() {
  const all = pool(), n = all.filter(c => got.has(c.id)).length;
  $('count').textContent = `🐾 ${n} / ${all.length}`;
  if (!target) { $('qn').textContent = '모든 고양이를 찾았어요!'; $('qh').textContent = 'Esc를 눌러 도감을 보세요.'; $('warm').textContent = ''; return; }
  $('qn').textContent = `${target.face} ??? — ${target.spot}`; $('qh').textContent = target.hint;
}
function warmth() {
  if (!target || !pos) return;
  const d = Math.hypot(pos[0] - target.at[0], pos[2] - target.at[1]);
  const w = d < 10 ? ['🔥 바로 근처예요! 둘러보세요', '#ff8a65'] : d < 30 ? ['♨️ 아주 가까워요', '#ffb74d'] : d < 70 ? ['🌤 가까워지고 있어요', '#ffe082'] : d < 150 ? ['🍃 조금 멀어요', '#c5e1a5'] : ['❄️ 멀어요', '#b3e5fc'];
  $('warm').textContent = w[0]; $('warm').style.color = w[1];
  if (d < NEAR) found(target);
}
async function placeCats() { for (const c of pool()) if (!got.has(c.id)) await map.voxelStamp({ id: c.id, x: c.at[0], z: c.at[1], rot: Math.floor(Math.random() * 4), cells: catCells(c.look) }).catch(() => {}); }
async function found(c) {
  if (got.has(c.id)) return; got.add(c.id); save(); await map.voxelUnstamp(c.id).catch(() => {});
  await map.voxelFly({ unlock: true }).catch(() => {}); // 지도 안에 잡힌 마우스를 풀어야 버튼을 누를 수 있어요
  $('ff').textContent = c.face; $('fn').textContent = `${josa(c.name, '을', '를')} 찾았어요!`;
  const legend = c === LEGEND, fin = !legend && CATS.every(x => got.has(x.id));
  $('fs').innerHTML = `여기는 <b>${c.spot}</b>이에요.<br>${c.hint}` + (fin ? '<br><br>🌟 모든 고양이를 모았어요! 전설의 고양이 <b>치삼이</b>가 나타났대요.' : '');
  if (fin) await map.voxelStamp({ id: LEGEND.id, x: LEGEND.at[0], z: LEGEND.at[1], cells: catCells(LEGEND.look) }).catch(() => {});
  target = pickNext(); drawQuest(); open('found');
}
function open(id) { document.querySelectorAll('.modal').forEach(m => m.classList.toggle('on', m.id === id)); document.body.classList.toggle('menu', !!id); }
function drawDex() {
  const all = pool(), n = all.filter(c => got.has(c.id)).length;
  $('dexsub').textContent = `${all.length}마리 중 ${n}마리를 찾았어요.`;
  $('dex').innerHTML = all.map(c => { const g = got.has(c.id); return `<button class="cat${g ? '' : ' lock'}${target === c ? ' on' : ''}" data-id="${c.id}"><div class="f">${c.face}</div><b>${g ? c.name : '???'}</b><small>${c.spot}</small></button>`; }).join('');
}
$('dex').onclick = e => { const b = e.target.closest('.cat'); if (!b) return; const c = ALL.find(x => x.id === b.dataset.id); if (got.has(c.id)) { toast(`${c.name}는 이미 찾았어요.`); return; } target = c; drawQuest(); drawDex(); toast(`이제 ${josa(c.spot, '을', '를')} 찾아가요.`); };
$('resume').onclick = () => open(null);
$('fnext').onclick = () => open(null);
$('reset').onclick = async () => { for (const c of ALL) await map.voxelUnstamp(c.id).catch(() => {}); got = new Set(); save(); target = pickNext(); await placeCats(); drawQuest(); drawDex(); toast('처음부터 다시 시작해요.'); };
map.on('fly', e => {
  if ('locked' in e) { document.body.classList.toggle('locked', e.locked); if (!e.locked && started && !document.querySelector('.modal.on')) { drawDex(); open('menu'); } if (e.locked) open(null); }
  if (e.pos) { pos = e.pos; warmth(); }
});
$('go').onclick = async () => {
  open(null); started = true; document.body.classList.add('ready');
  await map.voxelFly({ on: true, walk: true, building: '니콜스관' });
  target = pickNext(); await placeCats(); drawQuest();
  toast('화면을 누르고 W A S D로 걸어 보세요.', 4000);
};
target = pickNext(); drawQuest();
})().catch(e => { console.error(e); alert('불러오지 못했어요: ' + e.message); });
</script>
</body>
</html>
